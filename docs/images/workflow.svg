<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">ResolveSignal live investigation workflow</title>
<desc id="desc">Two product URLs lead to evidence retrieval, NVIDIA on Nebius reasoning, Tavily follow-up, source validation and deterministic comparison, then a result for review and export. LangSmith optionally records a minimized trace with readback verification.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs>
<rect width="1000" height="660" rx="12" fill="#f8f8f1"/>
<g font-family="Arial, sans-serif" fill="#111">
<rect x="34" y="20" width="600" height="60" fill="#111"/>
<rect x="30" y="16" width="600" height="60" fill="#ffdc00" stroke="#111" stroke-width="2"/>
<text x="50" y="41" font-size="19" font-weight="700">Two public product URLs</text>
<text x="50" y="63" font-size="16">US storefronts · USD listed prices</text>
<path d="M330 80 V93" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="34" y="100" width="600" height="60" fill="#111"/>
<rect x="30" y="96" width="600" height="60" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="50" y="121" font-size="19" font-weight="700">Read product evidence</text>
<text x="50" y="143" font-size="16">Direct page reads and Tavily extraction</text>
<path d="M330 160 V173" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="34" y="180" width="600" height="60" fill="#111"/>
<rect x="30" y="176" width="600" height="60" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="50" y="201" font-size="19" font-weight="700">NVIDIA on Nebius</text>
<text x="50" y="223" font-size="16">Formulate a bounded evidence question</text>
<path d="M330 240 V253" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="34" y="260" width="600" height="60" fill="#111"/>
<rect x="30" y="256" width="600" height="60" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="50" y="281" font-size="19" font-weight="700">Tavily follow-up</text>
<text x="50" y="303" font-size="16">Search and extract relevant evidence</text>
<path d="M330 320 V333" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="34" y="340" width="600" height="60" fill="#111"/>
<rect x="30" y="336" width="600" height="60" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="50" y="361" font-size="19" font-weight="700">NVIDIA on Nebius</text>
<text x="50" y="383" font-size="16">Propose facts with exact supporting quotes</text>
<path d="M330 400 V413" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="34" y="420" width="600" height="60" fill="#111"/>
<rect x="30" y="416" width="600" height="60" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="50" y="441" font-size="19" font-weight="700">Validate and compare</text>
<text x="50" y="463" font-size="16">Source support, identity, variants and offer terms</text>
<path d="M330 480 V493" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="34" y="500" width="600" height="60" fill="#111"/>
<rect x="30" y="496" width="600" height="60" fill="#ffdc00" stroke="#111" stroke-width="2"/>
<text x="50" y="521" font-size="19" font-weight="700">Show the result</text>
<text x="50" y="543" font-size="16">Decision, source quotes and missing details</text>
<path d="M330 560 V573" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="34" y="580" width="600" height="60" fill="#111"/>
<rect x="30" y="576" width="600" height="60" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="50" y="601" font-size="19" font-weight="700">Your next step</text>
<text x="50" y="623" font-size="16">Review, export or request a new check</text>
<path d="M634 526 H690" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="700" y="472" width="270" height="110" fill="#e8ebff" stroke="#111" stroke-width="2"/>
<text x="720" y="500" font-size="19" font-weight="700">LangSmith · optional</text>
<text x="720" y="526" font-size="16">Minimized outcome/call trace</text>
<text x="720" y="550" font-size="16">Verified by readback</text>
</g></svg>
